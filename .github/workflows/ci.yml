name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: Ninja
  CMAKE_CXX_COMPILER_LAUNCHER: sccache
  SCCACHE_GHA_ENABLED: 'true'

jobs:
  build-and-test:
    name: ${{ matrix.platform }} / Qt ${{ matrix.qt_version }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-2022
            qt_version: "6.12.0"
          - platform: Linux
            runner: ubuntu-24.04
            qt_version: "6.12.0"
          - platform: macOS
            runner: macos-15-intel
            qt_version: "6.12.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # Upstream aqt handles the architecture-specific Qt 6.11+ Windows repositories.
          aqtsource: ${{ runner.os == 'Windows' && 'git+https://github.com/miurahr/aqtinstall.git' || '' }}
          version: ${{ matrix.qt_version }}
          cache: true

      - name: Initialize the Windows compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up persistent compiler cache
        id: compiler-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DVNM_QT_DISPATCH_BUILD_TESTING=ON
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure --progress

      - name: Compiler cache statistics
        if: always() && steps.compiler-cache.outcome == 'success'
        run: sccache --show-stats
